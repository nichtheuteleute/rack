<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1280px;height:640px;overflow:hidden;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(84,197,248,.16), transparent 60%),
      radial-gradient(700px 400px at 10% 100%, rgba(94,234,212,.10), transparent 60%),
      linear-gradient(160deg,#0a1020 0%,#0e1830 55%,#0b1326 100%);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#e8eefc;position:relative}
  .dots{position:absolute;inset:0;
    background-image:radial-gradient(rgba(148,175,230,.13) 1px, transparent 1.4px);
    background-size:28px 28px;mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%)}
  .left{position:absolute;left:84px;top:96px;width:600px}
  .mark{font-size:148px;font-weight:800;letter-spacing:-6px;line-height:1;
    background:linear-gradient(180deg,#ffffff 0%,#cfe6ff 100%);-webkit-background-clip:text;color:transparent}
  .mark span{background:linear-gradient(90deg,#54c5f8,#5eead4);-webkit-background-clip:text;color:transparent}
  .tag{margin-top:18px;font-size:30px;font-weight:500;color:#b9c8e6;line-height:1.3;letter-spacing:-.3px}
  .tag b{color:#fff;font-weight:650}
  .pills{display:flex;gap:12px;margin-top:34px}
  .pill{font-size:19px;font-weight:600;padding:9px 16px;border-radius:999px;
    border:1.5px solid rgba(94,234,212,.45);color:#c9fbf1;background:rgba(94,234,212,.07)}
  .code{margin-top:40px;font-family:"SF Mono",Menlo,monospace;font-size:20px;color:#8ea3c9;
    background:rgba(9,16,32,.6);border:1px solid rgba(120,150,210,.18);border-radius:12px;padding:16px 20px;width:max-content}
  .k{color:#c792ea}.t{color:#54c5f8}.f{color:#e8eefc}.p{color:#5eead4}.c{color:#5d7096}
  svg{position:absolute;right:70px;top:70px}
</style></head><body>
<div class="dots"></div>
<div class="left">
  <div class="mark">rack<span>.</span></div>
  <div class="tag"><b>Small, explicit</b> dependency injection<br>and controller lifecycle for Flutter.</div>
  <div class="pills">
    <div class="pill">≈ 220 lines</div>
    <div class="pill">0 dependencies</div>
    <div class="pill">no code generation</div>
  </div>
  <div class="code"><span class="k">class</span> <span class="t">NotesModule</span> <span class="k">extends</span> <span class="t">RackModule</span> {<br>
&nbsp;&nbsp;<span class="t">NotesModule</span>(<span class="k">this</span>.<span class="p">settings</span>); <span class="c">// that's the wiring</span><br>}</div>
</div>

<svg width="470" height="500" viewBox="0 0 470 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355c"/><stop offset="1" stop-color="#1a2948"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#54c5f8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <!-- rack frame -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="330" height="460" rx="22" fill="url(#frame)" stroke="#2c4170" stroke-width="2"/>
    <rect x="34" y="34" width="20" height="432" rx="6" fill="#152340"/>
    <rect x="316" y="34" width="20" height="432" rx="6" fill="#152340"/>
  </g>
  <!-- rail holes -->
  <g fill="#0c1529">
    <circle cx="44" cy="60" r="3"/><circle cx="44" cy="90" r="3"/><circle cx="44" cy="160" r="3"/><circle cx="44" cy="190" r="3"/>
    <circle cx="44" cy="260" r="3"/><circle cx="44" cy="290" r="3"/><circle cx="44" cy="360" r="3"/><circle cx="44" cy="390" r="3"/><circle cx="44" cy="440" r="3"/>
    <circle cx="326" cy="60" r="3"/><circle cx="326" cy="90" r="3"/><circle cx="326" cy="160" r="3"/><circle cx="326" cy="190" r="3"/>
    <circle cx="326" cy="260" r="3"/><circle cx="326" cy="290" r="3"/><circle cx="326" cy="360" r="3"/><circle cx="326" cy="390" r="3"/><circle cx="326" cy="440" r="3"/>
  </g>

  <!-- module units -->
  <g font-family="SF Mono, Menlo, monospace" font-size="17" fill="#dbe7ff">
    <g>
      <rect x="62" y="50" width="246" height="76" rx="12" fill="url(#unit)" stroke="#33508a"/>
      <text x="84" y="84">SettingsModule</text>
      <text x="84" y="108" font-size="13" fill="#7f95bf">init 1</text>
      <circle cx="284" cy="78" r="5" fill="#5eead4" filter="url(#glow)"/>
      <rect x="250" y="98" width="42" height="6" rx="3" fill="#2d4675"/>
    </g>
    <g>
      <rect x="62" y="150" width="246" height="76" rx="12" fill="url(#unit)" stroke="#33508a"/>
      <text x="84" y="184">NotesModule</text>
      <text x="84" y="208" font-size="13" fill="#7f95bf">init 2</text>
      <circle cx="284" cy="178" r="5" fill="#5eead4" filter="url(#glow)"/>
      <rect x="250" y="198" width="42" height="6" rx="3" fill="#2d4675"/>
    </g>
    <g>
      <rect x="62" y="250" width="246" height="76" rx="12" fill="url(#unit)" stroke="#33508a"/>
      <text x="84" y="284">ArchiveModule</text>
      <text x="84" y="308" font-size="13" fill="#7f95bf">init 3</text>
      <circle cx="284" cy="278" r="5" fill="#54c5f8" filter="url(#glow)"/>
      <rect x="250" y="298" width="42" height="6" rx="3" fill="#2d4675"/>
    </g>
    <g>
      <rect x="62" y="350" width="246" height="76" rx="12" fill="url(#unit)" stroke="#33508a"/>
      <text x="84" y="384">ActivityModule</text>
      <text x="84" y="408" font-size="13" fill="#7f95bf">init 4</text>
      <circle cx="284" cy="378" r="5" fill="#54c5f8" filter="url(#glow)"/>
      <rect x="250" y="398" width="42" height="6" rx="3" fill="#2d4675"/>
    </g>
  </g>

  <!-- explicit dependency wires: dependent -> dependency -->
  <g fill="none" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M350 168 C 392 168, 392 92, 352 92" marker-end="url(#arrow)"/>
    <path d="M350 288 C 404 288, 404 198, 352 198" marker-end="url(#arrow)"/>
    <path d="M350 388 C 446 388, 446 212, 352 212" marker-end="url(#arrow)" opacity=".8"/>
  </g>
  <g font-family="-apple-system, Helvetica Neue, Arial" font-size="14" fill="#8fd9cc" font-weight="600" letter-spacing=".5">
    <text x="398" y="134">needs</text>
  </g>
</svg>
</body></html>
