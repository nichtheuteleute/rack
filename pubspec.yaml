name: rack
description: >-
  Lightweight dependency injection and controller lifecycle for Flutter.
  Typed modules with async init, one controller per screen, no code generation.
version: 0.1.0
repository: https://github.com/nichtheuteleute/rack
issue_tracker: https://github.com/nichtheuteleute/rack/issues
topics:
  - dependency-injection
  - state-management
  - signals
  - architecture

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  signals_flutter: ^7.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
